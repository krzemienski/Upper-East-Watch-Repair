kind = "web"
previewPath = "/"
title = "Upper East Watch Repair"
description = "A dark, cinematic luxury-horology website for Upper East Watch Repair, a shop on East 84th Street in Manhattan's Upper East Side. Features a parallax video hero, service pages for watch repair, battery replacement, and jewelry repair, customer testimonials, appointment booking via Cal.com embed, and a self-serve guides/blog platform with an admin editor protected by Replit Auth."
version = "1.0.0"
id = "artifacts/watch-repair"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26203

[services.development]
run = "pnpm --filter @workspace/watch-repair run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/watch-repair", "run", "build" ]
serve = "static"
publicDir = "artifacts/watch-repair/dist/public"

[[services.production.rewrites]]
from = "/services/watch-repair"
to = "/services/watch-repair.html"

[[services.production.rewrites]]
from = "/services/battery-replacement"
to = "/services/battery-replacement.html"

[[services.production.rewrites]]
from = "/services/jewelry-repair"
to = "/services/jewelry-repair.html"

[[services.production.rewrites]]
from = "/about"
to = "/about.html"

[[services.production.rewrites]]
from = "/book"
to = "/book.html"

[[services.production.rewrites]]
from = "/repair"
to = "/repair.html"

[[services.production.rewrites]]
from = "/repair/intake"
to = "/repair/intake.html"

[[services.production.rewrites]]
from = "/guides"
to = "/guides.html"

[[services.production.rewrites]]
from = "/admin"
to = "/admin.html"

[[services.production.rewrites]]
from = "/admin/leads"
to = "/admin/leads.html"

[[services.production.rewrites]]
from = "/repair/intake/in-store"
to = "/repair/intake/in-store.html"

[[services.production.rewrites]]
from = "/guides/*"
to = "/guides/*.html"

[[services.production.rewrites]]
from = "/*"
to = "/app.html"

[services.env]
PORT = "26203"
BASE_PATH = "/"
