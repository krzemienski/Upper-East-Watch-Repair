openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Upper East Watch Repair API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guides
    description: Public guide publishing
  - name: admin
    description: Protected guide administration
  - name: Auth
    description: Browser authentication endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guides:
    get:
      operationId: listPublishedGuides
      tags: [guides]
      summary: List published guides newest first
      responses:
        "200":
          description: Published guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"
  /guides/{slug}:
    get:
      operationId: getPublishedGuide
      tags: [guides]
      summary: Get one published guide
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"
        "404":
          description: Guide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/guides:
    get:
      operationId: listAdminGuides
      tags: [admin]
      summary: List all guides for the editor
      responses:
        "200":
          description: All guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createGuide
      tags: [admin]
      summary: Create a guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideInput"
      responses:
        "201":
          description: Guide created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"
        "400":
          description: Invalid guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/guides/{id}:
    patch:
      operationId: updateGuide
      tags: [admin]
      summary: Update and publish or unpublish a guide
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideUpdate"
      responses:
        "200":
          description: Guide updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Guide not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/guides/summary:
    get:
      operationId: getGuideSummary
      tags: [admin]
      summary: Get guide counts by publication state
      responses:
        "200":
          description: Guide summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start browser login
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to identity provider
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete browser login
      responses:
        "302":
          description: Redirect after authentication
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect after logout
  /funnel-events:
    post:
      operationId: createFunnelEvent
      tags: [leads]
      summary: Record a public funnel interaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FunnelEventInput" }
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunnelEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /leads:
    post:
      operationId: createRepairLead
      tags: [leads]
      summary: Submit a repair lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Lead submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /leads/{id}/uploads/request-url:
    post:
      operationId: requestLeadUploadUrl
      tags: [leads]
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/UploadToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "200":
          description: Presigned upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTarget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /leads/{id}/attachments:
    post:
      operationId: finalizeLeadAttachment
      tags: [leads]
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/UploadToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentInput" }
      responses:
        "201":
          description: Attachment finalized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadAttachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/leads:
    get:
      operationId: listRepairLeads
      tags: [admin]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LeadStatus" } }
        - { name: search, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Filtered leads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RepairLead" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/leads/report:
    get:
      operationId: getRepairLeadReport
      tags: [admin]
      responses:
        "200":
          description: Lead funnel summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/leads/{id}:
    get:
      operationId: getRepairLead
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/LeadId" }]
      responses:
        "200":
          description: Full lead record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepairLeadDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateRepairLead
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/LeadId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepairLead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/leads/{id}/notes:
    post:
      operationId: addRepairLeadNote
      tags: [admin]
      parameters: [{ $ref: "#/components/parameters/LeadId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadNoteInput" }
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/leads/{id}/attachments/{attachmentId}:
    get:
      operationId: downloadRepairLeadAttachment
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - name: attachmentId
          in: path
          required: true
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: Private image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/follow-ups:
    get:
      operationId: listFollowUps
      tags: [admin]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, completed, cancelled] } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Follow-up tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FollowUpTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/follow-ups/{id}:
    patch:
      operationId: updateFollowUp
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FollowUpUpdate" }
      responses:
        "200":
          description: Updated follow-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowUpTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int32 }
    UploadToken:
      name: X-Lead-Upload-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    LeadStatus:
      type: string
      enum: [new, contacted, visit_planned, watch_received, estimate_pending, won, lost]
    Attribution:
      type: object
      properties:
        utmSource: { type: string, maxLength: 255 }
        utmMedium: { type: string, maxLength: 255 }
        utmCampaign: { type: string, maxLength: 255 }
        utmTerm: { type: string, maxLength: 255 }
        utmContent: { type: string, maxLength: 255 }
        referrer: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 255 }
        variant: { type: string, maxLength: 120 }
        device: { type: string, maxLength: 80 }
        selectedCta: { type: string, maxLength: 160 }
    FunnelEventInput:
      allOf:
        - $ref: "#/components/schemas/Attribution"
        - type: object
          required: [event]
          properties:
            event: { type: string, minLength: 1, maxLength: 80 }
            sessionId: { type: string, maxLength: 255 }
            leadId: { type: integer, format: int32 }
            metadata: { type: object, additionalProperties: true }
    FunnelEvent:
      allOf:
        - $ref: "#/components/schemas/FunnelEventInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int32 }
            createdAt: { type: string, format: date-time }
    LeadInput:
      allOf:
        - $ref: "#/components/schemas/Attribution"
        - type: object
          required: [name, description]
          properties:
            name: { type: string, minLength: 1, maxLength: 160 }
            email: { type: string, format: email, maxLength: 320 }
            phone: { type: string, minLength: 5, maxLength: 40 }
            preferredChannel: { type: string, enum: [email, phone, sms, none], default: none }
            emailConsent: { type: boolean, default: false }
            phoneConsent: { type: boolean, default: false }
            smsConsent: { type: boolean, default: false }
            serviceNeeded: { type: string, maxLength: 120 }
            watchBrand: { type: string, maxLength: 120 }
            watchModel: { type: string, maxLength: 120 }
            description: { type: string, minLength: 1, maxLength: 5000 }
            intakeMode: { type: string, enum: [mail_in, in_store, unsure], default: unsure }
    RepairLead:
      allOf:
        - $ref: "#/components/schemas/LeadInput"
        - type: object
          required: [id, status, preferredChannel, emailConsent, phoneConsent, smsConsent, intakeMode, createdAt, updatedAt]
          properties:
            id: { type: integer, format: int32 }
            status: { $ref: "#/components/schemas/LeadStatus" }
            adminOwner: { type: [string, "null"] }
            adminSummary: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    LeadCreated:
      type: object
      required: [lead, uploadToken, uploadTokenExpiresAt]
      properties:
        lead: { $ref: "#/components/schemas/RepairLead" }
        uploadToken: { type: string }
        uploadTokenExpiresAt: { type: string, format: date-time }
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadTarget:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    AttachmentInput:
      allOf:
        - $ref: "#/components/schemas/UploadRequest"
        - type: object
          required: [objectPath]
          properties:
            objectPath: { type: string, pattern: "^/objects/repair-leads/[1-9][0-9]*/[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" }
    LeadAttachment:
      type: object
      required: [id, leadId, objectPath, originalName, contentType, size, createdAt]
      properties:
        id: { type: integer, format: int32 }
        leadId: { type: integer, format: int32 }
        objectPath: { type: string }
        originalName: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
    LeadEvent:
      type: object
      required: [id, leadId, type, createdAt]
      properties:
        id: { type: integer, format: int32 }
        leadId: { type: integer, format: int32 }
        type: { type: string }
        note: { type: [string, "null"] }
        fromStatus: { type: [string, "null"] }
        toStatus: { type: [string, "null"] }
        actorUserId: { type: [string, "null"] }
        metadata: { type: [object, "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    RepairLeadDetail:
      type: object
      required: [lead, attachments, events, followUps]
      properties:
        lead: { $ref: "#/components/schemas/RepairLead" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/LeadAttachment" }
        events:
          type: array
          items: { $ref: "#/components/schemas/LeadEvent" }
        followUps:
          type: array
          items: { $ref: "#/components/schemas/FollowUpTask" }
    LeadUpdate:
      type: object
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/LeadStatus" }
        adminOwner: { type: [string, "null"], maxLength: 160 }
        adminSummary: { type: [string, "null"], maxLength: 5000 }
    LeadNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 5000 }
    FollowUpTask:
      type: object
      required: [id, leadId, channel, status, dueAt, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32 }
        leadId: { type: integer, format: int32 }
        channel: { type: string, enum: [email, phone, sms] }
        status: { type: string, enum: [pending, completed, cancelled] }
        dueAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FollowUpUpdate:
      type: object
      minProperties: 1
      properties:
        status: { type: string, enum: [pending, completed, cancelled] }
        dueAt: { type: string, format: date-time }
    LeadReport:
      type: object
      required:
        - total
        - byStatus
        - bySource
        - byCampaign
        - byVariant
        - byServiceNeeded
        - metrics
        - stageConversionPercentages
        - conversionRate
      properties:
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
        bySource: { type: object, additionalProperties: { type: integer } }
        byCampaign: { type: object, additionalProperties: { type: integer } }
        byVariant: { type: object, additionalProperties: { type: integer } }
        byServiceNeeded: { type: object, additionalProperties: { type: integer } }
        metrics:
          type: object
          required: [callClicks, directionsClicks, intakeSubmissions, watchesReceived, wonRepairs]
          properties:
            callClicks: { type: integer }
            directionsClicks: { type: integer }
            intakeSubmissions: { type: integer }
            watchesReceived: { type: integer }
            wonRepairs: { type: integer }
        stageConversionPercentages:
          type: object
          required: [intakeToWatchReceived, watchReceivedToWon, intakeToWon]
          properties:
            intakeToWatchReceived: { type: number }
            watchReceivedToWon: { type: number }
            intakeToWon: { type: number }
        conversionRate: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Guide:
      type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - body
        - author
        - status
        - metaDescription
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        body:
          type: string
        author:
          type: string
        status:
          type: string
          enum: [draft, published]
        publishedAt:
          type: [string, "null"]
          format: date-time
        metaDescription:
          type: string
        ogImage:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GuideInput:
      type: object
      required: [slug, title, excerpt, body, author, status, metaDescription]
      properties:
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        body:
          type: string
        author:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, published]
        metaDescription:
          type: string
          minLength: 1
          maxLength: 160
        ogImage:
          type: [string, "null"]
    GuideUpdate:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        body:
          type: string
        author:
          type: string
          minLength: 1
        status:
          type: string
          enum: [draft, published]
        metaDescription:
          type: string
          minLength: 1
          maxLength: 160
        ogImage:
          type: [string, "null"]
    GuideSummary:
      type: object
      required: [total, published, drafts]
      properties:
        total:
          type: integer
          format: int32
        published:
          type: integer
          format: int32
        drafts:
          type: integer
          format: int32
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        isAdmin:
          type: boolean
          description: Whether this authenticated identity may access guide administration
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string